services:
  pizza-eats-ui:
    build:
      context: ./pizza-eats-ui
    container_name: pizza-eats-ui
    ports:
      - "4200:4200"
    depends_on:
      - pizza-eats-api
    networks:
      - pizza-eats-network

  pizza-eats-api:
    build:
      context: ./pizza-eats-api
    container_name: pizza-eats-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - pizza-eats-network

  postgres:
    image: postgres:17-alpine
    container_name: pizza-eats-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pizza-eats-network

volumes:
  postgres-data:

networks:
  pizza-eats-network:
    driver: bridge